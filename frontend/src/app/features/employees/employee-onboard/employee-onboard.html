<div class="page-header">
  <h1>従業員を追加</h1>
</div>

<form class="panel" [formGroup]="form" (ngSubmit)="submit()">
  <div class="field">
    <label for="name">氏名</label>
    <input id="name" class="input" type="text" formControlName="name" />
  </div>

  <div class="field">
    <label for="email">メールアドレス</label>
    <input id="email" class="input" type="email" formControlName="email" autocomplete="off" />
  </div>

  <div class="field">
    <label for="password">初期パスワード</label>
    <input id="password" class="input" type="password" formControlName="password" autocomplete="new-password" />
  </div>

  <div class="field">
    <label for="password_confirmation">初期パスワード（確認）</label>
    <input
      id="password_confirmation"
      class="input"
      type="password"
      formControlName="password_confirmation"
      autocomplete="new-password"
    />
  </div>

  <div class="field">
    <label for="employee_code">従業員コード</label>
    <input id="employee_code" class="input" type="text" formControlName="employee_code" />
  </div>

  <div class="field">
    <label for="role">ロール</label>
    <select id="role" class="input" formControlName="role">
      <option value="employee">一般社員</option>
      <option value="hr">人事</option>
    </select>
  </div>

  <div class="field">
    <label for="hired_at">入社日</label>
    <input id="hired_at" class="input" type="date" formControlName="hired_at" style="max-width: 200px" />
  </div>

  <div class="field">
    <label for="department_id">部署</label>
    <select id="department_id" class="input" formControlName="department_id">
      <option [value]="0">選択してください</option>
      @for (department of departments(); track department.id) {
        <option [value]="department.id">{{ department.name }}</option>
      }
    </select>
  </div>

  <div class="field">
    <label for="position_id">役職</label>
    <select id="position_id" class="input" formControlName="position_id">
      <option [value]="0">選択してください</option>
      @for (position of positions(); track position.id) {
        <option [value]="position.id">{{ position.name }}</option>
      }
    </select>
  </div>

  <div class="field">
    <label for="manager_id">上司（任意）</label>
    <select id="manager_id" class="input" formControlName="manager_id">
      <option value="">なし</option>
      @for (employee of employees(); track employee.id) {
        <option [value]="employee.id">{{ employee.name }}</option>
      }
    </select>
  </div>

  @if (error()) {
    <p class="alert">{{ error() }}</p>
  }

  <button type="submit" class="btn btn-primary" [disabled]="form.invalid || submitting()">登録する</button>
</form>
