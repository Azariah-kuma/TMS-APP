<main class="page" style="max-width: 360px">
  <h1>アカウント作成</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="name">名前</label>
      <input id="name" class="input" type="text" formControlName="name" autocomplete="name" />
    </div>

    <div class="field">
      <label for="email">メールアドレス</label>
      <input id="email" class="input" type="email" formControlName="email" autocomplete="email" />
    </div>

    <div class="field">
      <label for="password">パスワード</label>
      <input
        id="password"
        class="input"
        type="password"
        formControlName="password"
        autocomplete="new-password"
      />
    </div>

    <div class="field">
      <label for="password_confirmation">パスワード（確認）</label>
      <input
        id="password_confirmation"
        class="input"
        type="password"
        formControlName="password_confirmation"
        autocomplete="new-password"
      />
    </div>

    @if (error()) {
      <p class="alert" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="btn btn-primary" style="width: 100%" [disabled]="form.invalid || submitting()">
      登録
    </button>
  </form>

  <p class="muted" style="margin-top: 16px">
    アカウント作成後、利用開始には人事による従業員登録が必要です。<br />
    <a routerLink="/login">ログインへ戻る</a>
  </p>
</main>
