<div class="page-header">
  <h1>受講状況</h1>
</div>

@if (loading()) {
  <p class="muted">読み込み中…</p>
} @else if (showSplitView()) {
  <h2>自身の受講状況</h2>
  <app-enrollment-table [enrollments]="myEnrollments()" />

  <h2 style="margin-top: 24px">部下の受講状況</h2>
  <app-enrollment-table [enrollments]="subordinateEnrollments()" [showEmployeeColumn]="true" />
} @else {
  <app-enrollment-table [enrollments]="enrollments()" [showEmployeeColumn]="isHr()" />
}
