<div class="page-header">
  <h1>部署</h1>
</div>

@if (isHr()) {
  <form class="panel" [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="name">部署名</label>
      <input id="name" class="input" type="text" formControlName="name" />
    </div>

    <div class="field">
      <label for="code">部署コード</label>
      <input id="code" class="input" type="text" formControlName="code" />
    </div>

    @if (error()) {
      <p class="alert">{{ error() }}</p>
    }

    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || submitting()">部署を追加</button>
  </form>
}

@if (loading()) {
  <p class="muted">読み込み中…</p>
} @else if (departments().length === 0) {
  <p class="muted">部署がまだ登録されていません。</p>
} @else {
  <table class="table">
    <thead>
      <tr>
        <th>部署コード</th>
        <th>部署名</th>
      </tr>
    </thead>
    <tbody>
      @for (department of departments(); track department.id) {
        <tr>
          <td>{{ department.code }}</td>
          <td>{{ department.name }}</td>
        </tr>
      }
    </tbody>
  </table>
}
