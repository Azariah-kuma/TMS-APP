<header class="shell-header">
  <nav class="shell-nav">
    <span class="shell-brand">人事・研修管理</span>
    <a routerLink="/dashboard" routerLinkActive="is-active">ダッシュボード</a>
    <a routerLink="/trainings" routerLinkActive="is-active">研修</a>
    @if (isHr()) {
      <a routerLink="/employees" routerLinkActive="is-active">従業員</a>
      <a routerLink="/departments" routerLinkActive="is-active">部署</a>
      <a routerLink="/positions" routerLinkActive="is-active">役職</a>
    }
  </nav>

  <div class="shell-user">
    <span class="muted">{{ user()?.name }}</span>
    @if (employee(); as e) {
      @if (e.current_assignment?.position_name; as positionName) {
        <span class="badge" [class.badge-accent]="e.is_manager">{{ positionName }}</span>
      }
      @if (e.role === 'hr') {
        <span class="badge badge-muted">人事</span>
      }
    }
    <button type="button" class="btn btn-small" (click)="logout()">ログアウト</button>
  </div>
</header>

<main class="page">
  <router-outlet />
</main>
